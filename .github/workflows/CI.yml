name: CI
env:
  DEBUG: napi:*
  APP_NAME: node-rdev
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # MacOS
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bun run build

          # Windows (32-bit)
          - host: windows-latest
            target: i686-pc-windows-msvc
            build: bun run build

          # Linux Native (x64)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev pkg-config
              bun run build

    name: stable - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    # NOTE: the target is passed via CARGO_BUILD_TARGET (honored by both cargo
    # and the napi CLI) instead of `bun run build --target ...`, because bun
    # appends extra args only to the LAST command of the chained build script,
    # which would otherwise compile the host target first and upload a stray
    # host-arch .node file for cross targets.
    env:
      CARGO_BUILD_TARGET: ${{ matrix.settings.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARM64 GNU - native ARM runner (no QEMU needed, much faster and
  # more reliable than emulating a container on x64).
  build-linux-aarch64-gnu:
    name: stable - aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_BUILD_TARGET: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-dev libxtst-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: aarch64-unknown-linux-gnu

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: aarch64-unknown-linux-gnu-cargo-ubuntu-24.04-arm-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARMv7 GNU - fast cross-compile from x64 in a bookworm container.
  # There is no GitHub-hosted ARM32 runner; a QEMU-native build works but is
  # an order of magnitude slower (Rust + LTO under emulation), so this job
  # cross-compiles with the Debian armhf toolchain instead. Bookworm pins the
  # glibc sysroot at 2.36 so the artifact runs on Pi OS bookworm and newer.
  build-linux-armv7-gnu:
    name: stable - armv7-unknown-linux-gnueabihf
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm-slim
    env:
      # Honored by both cargo and the napi CLI (see the `build` job note).
      CARGO_BUILD_TARGET: armv7-unknown-linux-gnueabihf
      CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
      CC_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-gcc
      CXX_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-g++
      AR_armv7_unknown_linux_gnueabihf: arm-linux-gnueabihf-ar
      PKG_CONFIG_ALLOW_CROSS: '1'
      PKG_CONFIG_LIBDIR: /usr/lib/arm-linux-gnueabihf/pkgconfig:/usr/share/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cross toolchain and armhf system libs
        run: |
          export DEBIAN_FRONTEND=noninteractive
          dpkg --add-architecture armhf
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates unzip build-essential pkg-config \
            gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf \
            libx11-dev:armhf libxtst-dev:armhf libxi-dev:armhf \
            libxext-dev:armhf libxfixes-dev:armhf libxrender-dev:armhf
          rm -rf /var/lib/apt/lists/*

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: |
          source $HOME/.cargo/env
          rustup target add armv7-unknown-linux-gnueabihf

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: armv7-unknown-linux-gnueabihf-cargo-bookworm-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: |
          source $HOME/.cargo/env
          bun run build
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-armv7-unknown-linux-gnueabihf
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux x86_64 Musl - Use Alpine Docker for native musl build
  build-linux-x64-musl:
    name: stable - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash curl git python3 unzip \
            build-base musl-dev \
            libx11-dev libxtst-dev libxi-dev \
            libxext-dev libxfixes-dev libxrender-dev \
            pkgconfig



      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: |
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-musl

      - name: Install dependencies
        # npm: bun needs glibc and cannot run on Alpine/musl, so the frozen
        # bun.lock cannot be used here.
        run: |
          source $HOME/.cargo/env
          npm install --no-package-lock

      - name: Build
        run: |
          source $HOME/.cargo/env
          ./node_modules/.bin/napi build --platform --release --target x86_64-unknown-linux-musl

          # List built artifacts for debugging
          echo "=== Built artifacts ==="
          ls -la *.node || echo "No .node files found"
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test:
    name: test - ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
      - build-linux-aarch64-gnu
      - build-linux-armv7-gnu
      - build-linux-x64-musl
    strategy:
      fail-fast: false
      matrix:
        # Note: aarch64-pc-windows-msvc is built (see the build matrix above)
        # but intentionally not runtime-tested here: it is build-only because
        # there is no reliable GitHub-hosted Windows ARM64 test setup for this
        # project's toolchain (bun has no Windows ARM64 support).
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-latest
            target: i686-pc-windows-msvc
            architecture: x86
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: true
            musl: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: true
            platform: linux/arm64
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            docker: true
            platform: linux/arm/v7
            no_bun: true
        node:
          - '22'
          - '24'
        # The official Node 24 images dropped linux/arm/v7, so ARMv7 can
        # only be tested on Node 22.
        exclude:
          - settings:
              target: armv7-unknown-linux-gnueabihf
            node: '24'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}

      - name: Setup Bun
        if: ${{ !matrix.settings.docker && !matrix.settings.no_bun }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .

      - name: Test (Native)
        if: ${{ !matrix.settings.docker }}
        run: |
          if [ "${{ matrix.settings.host }}" = "windows-latest" ]; then
            bun install --frozen-lockfile
            bun run test
          elif [ "${{ matrix.settings.host }}" = "macos-latest" ]; then
            bun install --frozen-lockfile
            bun run test
          else
            sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb xauth
            bun install --frozen-lockfile
            xvfb-run bun run test
          fi
        shell: bash

      - name: Set up QEMU
        if: ${{ matrix.settings.docker && matrix.settings.platform }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: ${{ matrix.settings.platform == 'linux/arm/v7' && 'arm' || 'arm64' }}

      - name: Test (Docker)
        if: ${{ matrix.settings.docker }}
        run: |
          DOCKER_IMAGE="node:${{ matrix.node }}-bookworm-slim"
          if [ "${{ matrix.settings.musl }}" = "true" ]; then
            DOCKER_IMAGE="node:${{ matrix.node }}-alpine"
          fi

          PLATFORM_ARG=""
          if [ -n "${{ matrix.settings.platform }}" ]; then
            PLATFORM_ARG="--platform ${{ matrix.settings.platform }}"
          fi

          docker run --rm $PLATFORM_ARG -v $(pwd):/build -w /build $DOCKER_IMAGE sh -c "
            set -e
            if [ -f /etc/alpine-release ]; then
              apk add --no-cache bash curl unzip libxtst libx11 libxi libxext libxfixes libxrender xvfb-run xauth
            else
              export DEBIAN_FRONTEND=noninteractive
              apt-get update && apt-get install -y --no-install-recommends curl unzip libx11-6 libxtst6 libxi6 libxext6 libxfixes3 libxrender1 xvfb xauth
              rm -rf /var/lib/apt/lists/*
            fi

            if [ \"${{ matrix.settings.no_bun }}\" = \"true\" ]; then
              # npm: bun is unavailable on ARM32, so the frozen bun.lock cannot be used here.
              npm install --no-package-lock
              xvfb-run npm run test
            else
              curl -fsSL https://bun.sh/install | bash
              export BUN_INSTALL=\"\$HOME/.bun\"
              export PATH=\"\$BUN_INSTALL/bin:\$PATH\"
              bun install --frozen-lockfile
              xvfb-run bun run test
            fi
          "
        shell: bash

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bindings-*
          path: release-binaries
          merge-multiple: true
      - name: List binaries
        run: ls -R release-binaries
        shell: bash
      - name: Upload flat artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: all-binaries
          path: release-binaries
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          files: release-binaries/*.node
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
