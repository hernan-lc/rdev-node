name: CI
env:
  DEBUG: napi:*
  APP_NAME: node-rdev
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - v*
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # MacOS
          - host: macos-latest
            target: x86_64-apple-darwin
            build: bun run build --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: bun run build --target aarch64-apple-darwin

          # Windows
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            build: bun run build --target x86_64-pc-windows-msvc
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: bun run build --target aarch64-pc-windows-msvc

          # Windows (32-bit)
          - host: windows-latest
            target: i686-pc-windows-msvc
            build: bun run build --target i686-pc-windows-msvc

          # Linux Native (x64)
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            build: |
              sudo apt-get update
              sudo apt-get install -y libx11-dev libxtst-dev libxi-dev libxext-dev libxfixes-dev libxrender-dev pkg-config
              bun run build --target x86_64-unknown-linux-gnu

    name: stable - ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARM64 GNU - Use QEMU with Debian container for native build
  build-linux-aarch64-gnu:
    name: stable - aarch64-unknown-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Build in ARM64 container
        run: |
          docker run --rm --platform linux/arm64 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            node:20-slim bash -c '
              set -e
              
              # Install build dependencies
              apt-get update
              apt-get install -y curl unzip build-essential pkg-config \
                libx11-dev libxtst-dev libxi-dev \
                libxext-dev libxfixes-dev libxrender-dev
              
              # Install Bun
              curl -fsSL https://bun.sh/install | bash
              export BUN_INSTALL="$HOME/.bun"
              export PATH="$BUN_INSTALL/bin:$PATH"
              
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source $HOME/.cargo/env
              
              # Install dependencies and build
              $HOME/.bun/bin/bun install --frozen-lockfile
              $HOME/.bun/bin/bun run build --target aarch64-unknown-linux-gnu
            '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-aarch64-unknown-linux-gnu
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux ARMv7 GNU - Use QEMU with Debian container for native build
  build-linux-armv7-gnu:
    name: stable - armv7-unknown-linux-gnueabihf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm

      - name: Build in ARMv7 container
        run: |
          docker run --rm --platform linux/arm/v7 \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            node:20-bullseye-slim bash -c '
              set -e
              
              # Install build dependencies
              apt-get update
              apt-get install -y curl build-essential pkg-config \
                libx11-dev libxtst-dev libxi-dev \
                libxext-dev libxfixes-dev libxrender-dev
              
              # Install Rust
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
              source $HOME/.cargo/env
              
              # Install dependencies using npm (bun not available on ARM32, so the
              # frozen bun.lock cannot be used here)
              npm install
              
              # Build using napi-rs cli directly
              npx napi build --platform --release --target armv7-unknown-linux-gnueabihf
            '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-armv7-unknown-linux-gnueabihf
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Linux x86_64 Musl - Use Alpine Docker for native musl build
  build-linux-x64-musl:
    name: stable - x86_64-unknown-linux-musl
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install build dependencies
        run: |
          apk add --no-cache \
            bash curl git python3 unzip \
            build-base musl-dev \
            libx11-dev libxtst-dev libxi-dev \
            libxext-dev libxfixes-dev libxrender-dev \
            pkgconfig



      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add target
        run: |
          source $HOME/.cargo/env
          rustup target add x86_64-unknown-linux-musl

      - name: Install dependencies
        # npm: bun needs glibc and cannot run on Alpine/musl, so the frozen
        # bun.lock cannot be used here.
        run: |
          source $HOME/.cargo/env
          npm install

      - name: Build
        run: |
          source $HOME/.cargo/env
          npx napi build --platform --release --target x86_64-unknown-linux-musl
          
          # List built artifacts for debugging
          echo "=== Built artifacts ==="
          ls -la *.node || echo "No .node files found"
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bindings-x86_64-unknown-linux-musl
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  test:
    name: test - ${{ matrix.settings.target }} - node@${{ matrix.node }}
    needs:
      - build
      - build-linux-aarch64-gnu
      - build-linux-armv7-gnu
      - build-linux-x64-musl
    strategy:
      fail-fast: false
      matrix:
        # Note: aarch64-pc-windows-msvc is built (see the build matrix above)
        # but intentionally not runtime-tested here: it is build-only because
        # there is no reliable GitHub-hosted Windows ARM64 test setup for this
        # project's toolchain (bun has no Windows ARM64 support).
        settings:
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            architecture: x64
          - host: windows-latest
            target: i686-pc-windows-msvc
            architecture: x86
          - host: macos-latest
            target: aarch64-apple-darwin
            architecture: arm64
          - host: macos-latest
            target: x86_64-apple-darwin
            architecture: x64
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: true
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: true
            musl: true
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: true
            platform: linux/arm64
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            docker: true
            platform: linux/arm/v7
            no_bun: true
        node:
          - '20'
          - '22'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        if: ${{ !matrix.settings.docker }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          architecture: ${{ matrix.settings.architecture }}

      - name: Setup Bun
        if: ${{ !matrix.settings.docker && !matrix.settings.no_bun }}
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1
        with:
          bun-version: latest

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .

      - name: Test (Native)
        if: ${{ !matrix.settings.docker }}
        run: |
          if [ "${{ matrix.settings.host }}" = "windows-latest" ]; then
            bun install --frozen-lockfile
            bun run test
          elif [ "${{ matrix.settings.host }}" = "macos-latest" ]; then
            bun install --frozen-lockfile
            bun run test
          else
            sudo apt-get update && sudo apt-get install -y xvfb xauth
            bun install --frozen-lockfile
            xvfb-run bun run test
          fi
        shell: bash

      - name: Set up QEMU
        if: ${{ matrix.settings.docker && matrix.settings.platform }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: ${{ matrix.settings.platform }}

      - name: Test (Docker)
        if: ${{ matrix.settings.docker }}
        run: |
          DOCKER_IMAGE="node:${{ matrix.node }}-slim"
          if [ "${{ matrix.settings.musl }}" = "true" ]; then
            DOCKER_IMAGE="node:${{ matrix.node }}-alpine"
          fi
          
          PLATFORM_ARG=""
          if [ -n "${{ matrix.settings.platform }}" ]; then
            PLATFORM_ARG="--platform ${{ matrix.settings.platform }}"
          fi
          
          docker run --rm $PLATFORM_ARG -v $(pwd):/build -w /build $DOCKER_IMAGE sh -c "
            set -e
            if [ -f /etc/alpine-release ]; then
              apk add --no-cache bash curl unzip libxtst libx11 libxi libxext libxfixes libxrender xvfb-run xauth
            else
              apt-get update && apt-get install -y curl unzip libx11-6 libxtst6 libxi6 libxext6 libxfixes3 libxrender1 xvfb xauth
            fi
            
            if [ \"${{ matrix.settings.no_bun }}\" = \"true\" ]; then
              # npm: bun is unavailable on ARM32, so the frozen bun.lock cannot be used here.
              npm install
              xvfb-run npm run test
            else
              curl -fsSL https://bun.sh/install | bash
              export BUN_INSTALL=\"\$HOME/.bun\"
              export PATH=\"\$BUN_INSTALL/bin:\$PATH\"
              bun install --frozen-lockfile
              xvfb-run bun run test
            fi
          "
        shell: bash

  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bindings-*
          path: release-binaries
          merge-multiple: true
      - name: List binaries
        run: ls -R release-binaries
        shell: bash
      - name: Upload flat artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: all-binaries
          path: release-binaries
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release-binaries/*.node
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}